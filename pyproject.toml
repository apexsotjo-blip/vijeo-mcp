[project]
name = "vijeo-mcp"
version = "0.1.0"
description = "MCP server for Vijeo Designer HMI projects: read-only backup analysis and validated import-file generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "olefile>=0.46",
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
vijeo-mcp = "vijeo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
