[project]
name = "vijeo-mcp"
version = "0.2.0"
description = "MCP server for Vijeo Designer HMI projects: analyse and edit variables, data types, panels and trends directly in the project, verified offline and by Vijeo itself"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "olefile>=0.46",
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
vijeo-mcp = "vijeo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vijeo_mcp = ["templates.json"]
